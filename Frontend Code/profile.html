<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Profile</title>
    <!-- css code  -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 30px;
        background-color: rgb(20, 22, 45);
      }
      .container {
        /* border: 2px solid red; */
        box-shadow:
          0px 3px 3px #fff,
          -3px -4px 3px #fff;
        padding: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .container h1 {
        font-size: 22px;
      }
      .container h4 {
        color: gold;
        text-transform: uppercase;
        font-size: 50px;
        margin: 10px 0;
      }
      .container img {
        width: 100%;
        width: 200px;
        border: 2px solid #ff3;
        padding: 6px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Welcome To The Coding World</h1>
      <h4 id="username">Sathwik</h4>
      <img
        src="https://res.cloudinary.com/xhubcqne/image/upload/v1789329557/profile_pics/vxm6r67irrkhrbgy5mto.jpg"
        alt=""
        id="user-image"
      />
    </div>
    <!-- js code  -->
    <script>
      let username = document.getElementById("username");
      let userImage = document.getElementById("user-image");

      let existingToken = localStorage.getItem("tokenString");
      let url = "https://full-stack-trial-lmcb.onrender.com/";

      async function getProfile() {
        if (!existingToken || existingToken === null) {
          alert("Not Allowed");
          return;
        }
        let request = await fetch(`${url}profile`, {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${existingToken}`,
          },
        });
        let response = await request.json();
        console.log("out: ", response);
        if (response) {
          username.textContent = response.name;
          userImage.src = response.image;
        }
      }
      window.onload = getProfile();
    </script>
  </body>
</html>
