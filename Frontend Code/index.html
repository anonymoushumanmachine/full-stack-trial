<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Signup Page</title>
    <!-- font awesome  -->
    <script
      src="https://kit.fontawesome.com/c845a0699c.js"
      crossorigin="anonymous"
    ></script>
    <!-- css code  -->
    <link rel="stylesheet" href="./signup.css" />
  </head>
  <body>
    <h1>Signup Page</h1>
    <p class="output-message"></p>
    <form class="signup-form">
      <!-- username -->
      <div class="input-box">
        <input type="text" id="username" placeholder="username" />
      </div>
      <!-- password -->
      <div class="input-box">
        <input type="password" id="password" placeholder="password" />
        <i class="fa-solid fa-eye"></i>
      </div>
      <p>select profile pic</p>
      <div class="input-box profile-box">
        <input type="file" id="profile-pic" />
      </div>
      <button id="signup-button" type="button">signup</button>
      <h3 id="side-link">Already registered ?<a href="">Login</a></h3>
    </form>
    <!-- js code  -->
    <script src="./signup.js"></script>
  </body>
</html>
